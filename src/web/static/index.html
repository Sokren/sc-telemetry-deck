<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<title>SC Telemetry Deck</title>
		<link rel="stylesheet" href="style.css" />
		<script src="theme-boot.js"></script>
	</head>
	<body>
		<header>
			<h1 id="title">SC Telemetry Deck</h1>
			<span id="version" class="version"></span>
			<span id="status" class="status"><span class="dot"></span><span id="status-text"></span></span>
			<a id="update-badge" class="update-badge" target="_blank" rel="noopener" hidden></a>
			<button id="setup-open" class="setup-open" type="button" hidden></button>
			<nav>
				<button id="view-lock" class="lock" type="button" hidden></button>
				<button id="options-open" class="options-open" type="button"></button>
			</nav>
		</header>
		<div class="tabs" role="tablist">
			<button type="button" role="tab" data-tab="grid" id="tab-grid"></button>
			<button type="button" role="tab" data-tab="character" id="tab-character"></button>
			<button type="button" role="tab" data-tab="ship" id="tab-ship"></button>
			<button type="button" role="tab" data-tab="debug" id="tab-debug" class="tab-debug" hidden></button>
			<span id="view-tabs" class="view-tabs"></span>
			<button type="button" id="view-add" class="tab-add" hidden>＋</button>
			<select id="tab-select" class="tab-select"></select>
		</div>
		<main>
			<p id="message" hidden></p>
			<p id="notice" class="notice" hidden></p>

			<section id="panel-grid" role="tabpanel">
				<div id="grid" class="grid"></div>
			</section>

			<section id="panel-character" role="tabpanel" hidden>
				<p id="char-head" class="subhead"></p>
				<h2 id="h-vitals"></h2>
				<div id="char-vitals" class="cards"></div>
				<h2 id="h-player-actions"></h2>
				<div id="char-actions" class="cards"></div>
				<h2 id="h-emotes"></h2>
				<p id="emotes-hint" class="hint"></p>
				<div id="char-emotes" class="cards"></div>
			</section>

			<section id="panel-ship" role="tabpanel" hidden>
				<div id="pilot-recap" class="pilot-recap" hidden></div>
				<div id="ship-card" hidden></div>
				<p id="ship-head" class="subhead"></p>
				<div class="cards ship-commands">
					<button type="button" id="flight-ready" class="card function emote flight-ready"><div class="label"></div><span class="flash"></span></button>
				</div>
				<h2 id="h-instruments"></h2>
				<div id="ship-instruments" class="cards"></div>
				<h2 id="h-lights"></h2>
				<div id="ship-lights" class="lights"></div>
				<h2 id="h-functions"></h2>
				<p id="functions-hint" class="hint"></p>
				<div id="ship-functions" class="cards functions"></div>
			</section>
			<section id="panel-debug" role="tabpanel" class="debug" hidden></section>
			<section id="panel-myview" role="tabpanel" hidden>
				<div id="myview"></div>
			</section>
		</main>
		<dialog id="auto" class="lan" aria-labelledby="auto-title"></dialog>
		<dialog id="lan" class="lan" aria-label="Tablette / téléphone"></dialog>
		<dialog id="about" aria-labelledby="about-title">
			<h2 id="about-title"></h2>
			<dl id="about-facts"></dl>
			<ul id="about-notes"></ul>
			<p id="about-links" class="links"></p>
			<form method="dialog"><button id="about-close" type="submit"></button></form>
		</dialog>
		<dialog id="setup" class="setup" aria-labelledby="setup-title"></dialog>
		<dialog id="options" class="options" aria-labelledby="options-title">
			<h2 id="options-title"></h2>
			<section class="opt-section">
				<h3 id="opt-h-look"></h3>
				<div id="opt-themes" class="opt-themes" role="radiogroup"></div>
				<div class="opt-row">
					<label for="opt-accent" id="opt-accent-label"></label>
					<input type="color" id="opt-accent" />
					<button id="opt-accent-reset" type="button"></button>
				</div>
			</section>
			<section class="opt-section">
				<h3 id="opt-h-danger"></h3>
				<label class="opt-check"><input type="checkbox" id="opt-danger" /> <span id="opt-danger-label"></span></label>
				<label class="opt-check"><input type="checkbox" id="opt-recap" /> <span id="opt-recap-label"></span></label>
			</section>
			<section class="opt-section">
				<h3 id="opt-h-lang"></h3>
				<div class="opt-row" id="lang" role="radiogroup"></div>
			</section>
			<section class="opt-section">
				<h3 id="opt-h-numbers"></h3>
				<div class="opt-row" id="opt-numbers" role="radiogroup"></div>
			</section>
			<section class="opt-section">
				<h3 id="opt-h-auto"></h3>
				<div class="opt-row"><button id="auto-open" class="auto-open" type="button" data-leave="auto"></button></div>
			</section>
			<section class="opt-section opt-lan">
				<h3 id="opt-h-lan"></h3>
				<div class="opt-row"><button id="lan-open" class="lan-open" type="button" data-leave="lan" hidden></button></div>
			</section>
			<section class="opt-section">
				<h3 id="opt-h-advanced"></h3>
				<label class="opt-check"><input type="checkbox" id="opt-debug" /> <span id="opt-debug-label"></span></label>
			</section>
			<section class="opt-section">
				<h3 id="opt-h-update"></h3>
				<div class="opt-row opt-update">
					<span id="update-state" class="update-state"></span>
					<button id="update-check" type="button"></button>
					<a id="update-open" class="update-open" target="_blank" rel="noopener" hidden></a>
				</div>
				<label class="opt-check"><input type="checkbox" id="opt-update-auto" /> <span id="opt-update-auto-label"></span></label>
			</section>
			<section class="opt-section">
				<h3 id="opt-h-help"></h3>
				<div class="opt-row">
					<button id="opt-setup" type="button" data-leave="setup"></button>
					<button id="about-open" type="button" data-leave="about"></button>
					<a id="api" href="/api/docs" target="_blank" rel="noopener"></a>
				</div>
			</section>
			<form method="dialog"><button id="options-close" type="submit"></button></form>
		</dialog>
		<script type="module" src="app.js"></script>
	</body>
</html>
